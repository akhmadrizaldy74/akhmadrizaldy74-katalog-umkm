# Production di Oracle Cloud VM (Always Free).
# Jalankan dari root repo:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Caddy otomatis mengurus HTTPS (Let's Encrypt) untuk API_DOMAIN.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-umkm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umkm}"]
      interval: 10s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-umkm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-umkm}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?isi API_DOMAIN di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  # Backup harian PostgreSQL (disimpan 7 hari di volume `backups`)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U ${POSTGRES_USER:-umkm} ${POSTGRES_DB:-umkm} | gzip > /backups/umkm-$$(date +%F).sql.gz;
        find /backups -name "*.sql.gz" -mtime +7 -delete;
        sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  backups:
