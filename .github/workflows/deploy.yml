# Deploy otomatis setelah CI lolos di branch main.
# Aktifkan dengan membuat repository variable DEPLOY_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables) dan isi secrets di README.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  api:
    name: API → Oracle Cloud VM
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd ~/katalog-umkm
            git fetch --all && git reset --hard origin/main
            docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
            docker image prune -f
            sleep 10
            docker compose -f deploy/docker-compose.prod.yml exec -T api \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
            docker compose -f deploy/docker-compose.prod.yml ps

  web:
    name: Frontend → Cloudflare Pages
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
